<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>충북교육청 AI 교원연수 준비 현황</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1f2437;
    --border: #2a3050;
    --accent: #4f8ef7;
    --accent2: #7c6af7;
    --green: #3dd68c;
    --yellow: #f5c842;
    --red: #f76f6f;
    --text: #e8ecf4;
    --muted: #6b7a9e;
    --naver: #00c73c;
    --upstage: #8b5cf6;
    --sejong: #c3002f;
    --ops: #e8ecf4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard','Malgun Gothic',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px 24px; }

  /* ── Loading ── */
  #loadingOverlay { position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;transition:opacity .4s; }
  #loadingOverlay.hidden { opacity:0;pointer-events:none; }
  .spinner { width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-size:14px;color:var(--muted); }

  /* ── Sync ── */
  #syncStatus { position:fixed;bottom:20px;right:20px;font-size:12px;padding:6px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:flex;align-items:center;gap:6px;transition:all .3s;z-index:100; }
  #syncStatus.syncing { border-color:var(--yellow);color:var(--yellow); }
  #syncStatus.synced  { border-color:var(--green); color:var(--green);  }
  #syncStatus.error   { border-color:var(--red);   color:var(--red);    }
  .sync-dot { width:6px;height:6px;border-radius:50%;background:currentColor; }
  #syncStatus.syncing .sync-dot { animation:pulse 1s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

  /* ── Header ── */
  .header { max-width:960px;margin:0 auto 32px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px; }
  .header-left h1 { font-size:22px;font-weight:700;letter-spacing:-.5px; }
  .header-left h1 span { color:var(--accent); }
  .header-left .meta { margin-top:8px;font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap; }
  .meta-chip { display:flex;align-items:center;gap:5px; }
  .meta-chip .dot { width:6px;height:6px;border-radius:50%;background:var(--accent); }
  .dday { font-family:'DM Mono',monospace;font-size:13px;font-weight:500;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:6px 14px;border-radius:999px;white-space:nowrap; }

  /* ── Sticky Nav ── */
  .sticky-nav {
    position:sticky;top:0;z-index:200;
    background:rgba(15,17,23,.92);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    margin:0 -24px 28px;padding:0 24px;
  }
  .sticky-nav-inner {
    max-width:960px;margin:0 auto;
    display:flex;gap:4px;padding:8px 0;
  }
  .snav-btn {
    font-family:'Pretendard',sans-serif;font-size:13px;font-weight:600;
    padding:7px 18px;border-radius:99px;
    border:1.5px solid transparent;
    background:transparent;color:var(--muted);
    cursor:pointer;transition:all .2s;white-space:nowrap;
  }
  .snav-btn:hover { color:var(--text);background:rgba(255,255,255,.06);border-color:var(--border); }
  .snav-btn.active { color:var(--accent);background:rgba(79,142,247,.12);border-color:rgba(79,142,247,.35); }
  .snav-link {
    text-decoration:none;display:inline-flex;align-items:center;
    margin-left:auto;
    color:var(--accent);border-color:rgba(79,142,247,.3);
    background:rgba(79,142,247,.06);
  }
  .snav-link:hover { color:var(--accent);background:rgba(79,142,247,.14);border-color:var(--accent); }

  /* ── Progress ── */
  .progress-section { max-width:960px;margin:0 auto 28px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap; }
  .progress-label { font-size:13px;color:var(--muted);white-space:nowrap; }
  .progress-bar-wrap { flex:1;min-width:200px;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden; }
  .progress-bar-fill { height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .6s ease; }
  .progress-pct { font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--accent);white-space:nowrap; }
  .stat-chips { display:flex;gap:10px; }
  .stat-chip { font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);color:var(--muted); }
  .stat-chip.done { border-color:var(--green);color:var(--green); }
  .stat-chip.todo { border-color:var(--yellow);color:var(--yellow); }

  /* ══ ADD SECTION ══ */
  .add-section { max-width:960px;margin:0 auto 12px;background:rgba(79,142,247,.04);border:2px solid var(--accent);border-radius:18px;padding:22px 24px 20px;box-shadow:0 0 0 5px rgba(79,142,247,.06),0 4px 24px rgba(0,0,0,.3); }
  .add-title { font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--accent);margin-bottom:18px;display:flex;align-items:center;gap:8px; }
  .add-title-icon { width:32px;height:32px;border-radius:9px;background:rgba(79,142,247,.15);display:flex;align-items:center;justify-content:center;font-size:16px; }
  .add-grid { display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px 12px; }
  .add-field { display:flex;flex-direction:column;gap:5px; }
  .add-field.full { grid-column:span 4; }
  .field-label { font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase; }
  .add-section input[type=text],.add-section input[type=date],.add-section select {
    font-family:'Pretendard',sans-serif;font-size:13px;background:var(--surface2);border:1px solid var(--border);
    color:var(--text);border-radius:9px;padding:9px 12px;outline:none;transition:border-color .2s;width:100%;
  }
  .add-section input[type=date] { color-scheme:dark; }
  .add-section input::placeholder { color:var(--muted); }
  .add-section input:focus,.add-section select:focus { border-color:var(--accent); }
  .add-section select option { background:var(--surface2); }
  .agency-btn-group { display:flex;gap:7px;flex-wrap:wrap; }
  .agency-btn { font-family:'Pretendard',sans-serif;font-size:12px;font-weight:500;padding:7px 13px;border-radius:99px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap; }
  .agency-btn:hover { border-color:var(--text);color:var(--text); }
  .agency-btn.active-ops     { border-color:var(--ops);    color:var(--ops);    background:rgba(232,236,244,.1); }
  .agency-btn.active-naver   { border-color:var(--naver);  color:var(--naver);  background:rgba(0,199,60,.12); }
  .agency-btn.active-upstage { border-color:var(--upstage);color:var(--upstage);background:rgba(139,92,246,.12); }
  .agency-btn.active-sejong  { border-color:var(--sejong); color:var(--sejong); background:rgba(195,0,47,.12); }
  .add-footer { margin-top:14px;display:flex;justify-content:flex-end; }
  .btn-add { font-family:'Pretendard',sans-serif;font-size:14px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;padding:11px 28px;cursor:pointer;transition:opacity .2s;box-shadow:0 4px 14px rgba(79,142,247,.3); }
  .btn-add:hover { opacity:.88; }
  .btn-add:disabled { opacity:.4;cursor:not-allowed; }

  /* ══ TODO LIST HEADER ══ */
  .todo-list-header { max-width:960px;margin:32px auto 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
  .todo-list-title { font-size:26px;font-weight:800;letter-spacing:-.8px; }
  .todo-list-title span { color:var(--accent); }

  /* 뷰 탭 + 완료 필터 */
  .list-controls { display:flex;flex-wrap:wrap;gap:8px;align-items:center; }
  .view-tabs { display:flex;gap:5px; }
  .view-tab {
    font-family:'Pretendard',sans-serif;font-size:13px;font-weight:500;
    padding:6px 14px;border-radius:99px;border:1.5px solid var(--border);
    background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;
  }
  .view-tab:hover { border-color:var(--accent);color:var(--accent);background:rgba(79,142,247,.07); }
  .view-tab.active { border-color:var(--accent);color:var(--accent);background:rgba(79,142,247,.12);font-weight:600; }

  /* 필터 행 레이아웃 */
  .filter-row {
    max-width:960px;margin:0 auto 12px;
    display:flex;align-items:flex-start;gap:14px;
  }
  .filter-row-label {
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap;
    padding-top:8px;min-width:64px;
    border-right:1px solid var(--border);padding-right:12px;
    font-family:'DM Mono',monospace;
  }
  /* 카테고리 필터 */
  .filter-section { flex:1;display:flex;gap:8px;flex-wrap:wrap;margin:0; }
  .filter-btn { font-family:'Pretendard',sans-serif;font-size:13px;padding:6px 14px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s; }
  .filter-btn.active,.filter-btn:hover { border-color:var(--accent);color:var(--accent);background:rgba(79,142,247,.08); }

  /* 담당기관 필터 */
  .agency-filter-section { flex:1;display:flex;gap:7px;flex-wrap:wrap;margin:0; }
  .agency-filter-btn {
    font-family:'Pretendard',sans-serif;font-size:12px;font-weight:500;
    padding:5px 13px;border-radius:99px;border:1.5px solid var(--border);
    background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;
    white-space:nowrap;
  }
  .agency-filter-btn:hover { border-color:var(--text);color:var(--text); }
  .agency-filter-btn.af-all.active { border-color:var(--accent);color:var(--accent);background:rgba(79,142,247,.1);font-weight:600; }
  .agency-filter-btn.af-ops.active     { border-color:var(--ops);    color:var(--ops);    background:rgba(232,236,244,.08); font-weight:600; }
  .agency-filter-btn.af-naver.active   { border-color:var(--naver);  color:var(--naver);  background:rgba(0,199,60,.08);    font-weight:600; }
  .agency-filter-btn.af-upstage.active { border-color:var(--upstage);color:var(--upstage);background:rgba(139,92,246,.08);  font-weight:600; }
  .agency-filter-btn.af-sejong.active  { border-color:var(--sejong); color:var(--sejong); background:rgba(195,0,47,.08);    font-weight:600; }

  /* ── Category groups ── */
  .categories { max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px; }
  .cat-group { background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden; }
  .cat-header { display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none; }
  .cat-header:hover { background:var(--surface2); }
  .cat-title { display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600; }
  .cat-icon { width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px; }
  .cat-stats { display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted); }
  .mini-progress { width:60px;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden; }
  .mini-progress-fill { height:100%;border-radius:99px;transition:width .4s; }
  .collapse-btn { font-size:11px;color:var(--muted);transition:transform .2s; }
  .cat-group.collapsed .collapse-btn { transform:rotate(-90deg); }
  .cat-group.collapsed .task-list { display:none; }

  /* ── Task item ── */
  .task-list { padding:4px 0; }
  .task-item { border-bottom:1px solid rgba(42,48,80,.5);transition:background .15s;animation:fadeIn .25s ease; }
  .task-item:last-child { border-bottom:none; }
  .task-item:hover { background:rgba(255,255,255,.015); }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none} }

  /* 메인 행 */
  .task-main { display:flex;align-items:center;gap:12px;padding:12px 18px; }

  /* ── 완료 버튼 ── */
  .check-wrap {
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    height:26px;padding:0 11px;border-radius:99px;
    border:1.5px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04);
    cursor:pointer;transition:all .2s;
    gap:5px;
  }
  .check-wrap:hover { border-color:var(--green);background:rgba(61,214,140,.1); }
  .check-wrap .check-icon { font-size:11px;color:rgba(255,255,255,.25);transition:all .2s;font-weight:700;line-height:1; }
  .check-wrap .check-label { font-size:11px;font-weight:600;color:rgba(255,255,255,.25);transition:all .2s;white-space:nowrap;letter-spacing:.02em; }
  .check-wrap:hover .check-icon,
  .check-wrap:hover .check-label { color:var(--green); }
  .task-item.done .check-wrap { background:rgba(61,214,140,.15);border-color:var(--green); }
  .task-item.done .check-wrap .check-icon,
  .task-item.done .check-wrap .check-label { color:var(--green); }
  .task-item.done .task-text { text-decoration:line-through;color:var(--muted); }
  .task-item.done .task-deadline { opacity:.45; }

  /* 한 줄 콘텐츠 */
  .task-content { flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0; }
  .task-text { font-size:14px;font-weight:500;line-height:1.4;flex:1;min-width:100px; }

  /* Tags */
  .tag { font-size:11px;padding:2px 9px;border-radius:99px;background:#1a2040;color:var(--muted);border:1px solid var(--border);white-space:nowrap; }
  .tag.priority-high { color:var(--red);   border-color:rgba(247,111,111,.35);background:rgba(247,111,111,.08);font-weight:700; }
  .tag.priority-mid  { color:var(--yellow);border-color:rgba(245,200,66,.35); background:rgba(245,200,66,.08); font-weight:700; }
  .tag.agency-ops    { color:var(--ops);   border-color:rgba(232,236,244,.3); background:rgba(232,236,244,.07); }
  .tag.agency-naver  { color:var(--naver); border-color:rgba(0,199,60,.35);   background:rgba(0,199,60,.08); }
  .tag.agency-upstage{ color:var(--upstage);border-color:rgba(139,92,246,.4); background:rgba(139,92,246,.1);font-weight:500; }
  .tag.agency-sejong { color:var(--sejong);border-color:rgba(195,0,47,.4);    background:rgba(195,0,47,.1);  font-weight:500; }
  .tag.confirmed     { color:var(--green); border-color:rgba(61,214,140,.35); background:rgba(61,214,140,.08); }
  .tag.cat-tag       { font-size:10px;padding:1px 7px; }

  .task-deadline { font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap; }
  .task-deadline.near { color:var(--yellow); }
  .task-deadline.over { color:var(--red); }

  /* 액션 버튼 */
  .task-actions { display:flex;gap:2px;flex-shrink:0; }
  .btn-icon { background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px;transition:all .15s;line-height:1; }
  .btn-icon:hover { background:var(--surface2); }
  .btn-edit:hover { color:var(--accent); }
  .btn-link:hover { color:var(--yellow); }
  .btn-del:hover  { color:var(--red); }

  /* ── 링크 영역 ── */
  .task-links { padding:0 18px 0 18px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px; }
  .task-link-chip {
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:500;
    padding:4px 10px 4px 8px;border-radius:99px;
    background:rgba(79,142,247,.1);border:1px solid rgba(79,142,247,.3);
    color:var(--accent);text-decoration:none;
    transition:all .15s;max-width:260px;
  }
  .task-link-chip:hover { background:rgba(79,142,247,.2);border-color:var(--accent); }
  .task-link-chip .link-icon { font-size:11px;flex-shrink:0; }
  .task-link-chip .link-label { white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .task-link-del {
    background:none;border:none;cursor:pointer;
    color:rgba(79,142,247,.5);font-size:12px;padding:0 0 0 3px;
    line-height:1;transition:color .15s;flex-shrink:0;
  }
  .task-link-del:hover { color:var(--red); }

  /* 링크 추가 인라인 폼 */
  .link-add-row {
    display:none;align-items:center;gap:7px;
    padding:6px 18px 8px;flex-wrap:wrap;
  }
  .link-add-row.open { display:flex; }
  .link-inp {
    font-family:'Pretendard',sans-serif;font-size:12px;
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text);border-radius:7px;padding:6px 10px;
    outline:none;transition:border-color .2s;
  }
  .link-inp:focus { border-color:var(--accent); }
  .link-inp::placeholder { color:var(--muted); }
  .link-inp.url { flex:2;min-width:160px; }
  .link-inp.label { flex:1;min-width:80px; }
  .link-save-btn {
    font-family:'Pretendard',sans-serif;font-size:12px;font-weight:600;
    background:rgba(79,142,247,.15);color:var(--accent);
    border:1px solid rgba(79,142,247,.3);border-radius:7px;
    padding:6px 13px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;
  }
  .link-save-btn:hover { background:rgba(79,142,247,.28); }
  .link-cancel-btn {
    font-family:'Pretendard',sans-serif;font-size:12px;
    background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 6px;
  }
  .link-cancel-btn:hover { color:var(--text); }
  .task-memo-wrap { padding:0 18px 12px 18px; }
  .memo-list { display:flex;flex-direction:column;gap:5px;margin-bottom:10px; }
  .memo-item {
    display:grid;
    grid-template-columns:auto 1fr auto auto;
    gap:0 10px;
    align-items:center;
    background:var(--surface2);
    border-radius:10px;padding:8px 10px 8px 13px;
    border-left:3px solid var(--border);
    transition:border-color .2s;
  }
  .memo-item:hover { border-left-color:var(--accent); }
  .memo-writer {
    font-size:12px;font-weight:700;white-space:nowrap;
    color:var(--accent);align-self:baseline;padding-top:1px;
  }
  /* 작성자 색상별 */
  .memo-writer.w-ops     { color:var(--ops); }
  .memo-writer.w-naver   { color:var(--naver); }
  .memo-writer.w-upstage { color:var(--upstage); }
  .memo-writer.w-sejong  { color:var(--sejong); }
  .memo-text { font-size:13px;line-height:1.55;color:var(--text);align-self:baseline;padding-top:1px; }
  .memo-date { font-size:10px;color:var(--muted);white-space:nowrap;font-family:'DM Mono',monospace;text-align:right;align-self:baseline;padding-top:2px; }
  /* 메모 액션 버튼 */
  .memo-actions { display:flex;gap:2px;flex-shrink:0; }
  .memo-btn { background:none;border:none;cursor:pointer;font-size:13px;padding:3px 6px;border-radius:5px;color:var(--muted);transition:all .15s;line-height:1; }
  .memo-btn:hover { background:var(--surface);color:var(--text); }
  .memo-btn.del:hover { color:var(--red); }
  /* 메모 인라인 수정 */
  .memo-item.editing { grid-template-columns:auto 1fr auto;border-left-color:var(--accent); }
  .memo-edit-inp {
    font-family:'Pretendard',sans-serif;font-size:13px;
    background:var(--surface);border:1px solid var(--accent);
    color:var(--text);border-radius:6px;padding:4px 8px;
    outline:none;width:100%;
  }

  /* 입력 행 */
  .memo-input-row {
    display:flex;gap:8px;align-items:center;
    background:var(--surface2);border:1px solid var(--border);
    border-radius:10px;padding:6px 6px 6px 10px;
    transition:border-color .2s;
  }
  .memo-input-row:focus-within { border-color:rgba(79,142,247,.4); }
  .memo-writer-sel {
    font-family:'Pretendard',sans-serif;font-size:12px;font-weight:600;
    background:transparent;border:none;color:var(--accent);
    outline:none;cursor:pointer;padding:0;
  }
  .memo-divider { color:var(--border);font-size:12px;flex-shrink:0; }
  .memo-text-inp {
    flex:1;font-family:'Pretendard',sans-serif;font-size:13px;
    background:transparent;border:none;color:var(--text);outline:none;
  }
  .memo-text-inp::placeholder { color:var(--muted); }
  .memo-send-btn {
    font-family:'Pretendard',sans-serif;font-size:12px;font-weight:700;
    background:rgba(79,142,247,.15);color:var(--accent);
    border:1px solid rgba(79,142,247,.25);border-radius:7px;
    padding:5px 14px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;
  }
  .memo-send-btn:hover { background:rgba(79,142,247,.28); }

  /* 최종 수정일 */
  .task-last-updated { font-size:10px;color:var(--muted);padding:0 18px 8px 58px;font-family:'DM Mono',monospace; }

  /* ── 수정 모달 ── */
  .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px; }
  .modal-overlay.hidden { display:none; }
  .modal { background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .modal-title { font-size:17px;font-weight:700;margin-bottom:20px;color:var(--accent); }
  .modal-grid { display:flex;flex-direction:column;gap:14px; }
  .modal-field { display:flex;flex-direction:column;gap:5px; }
  .modal-field label { font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase; }
  .modal-field input,.modal-field select {
    font-family:'Pretendard',sans-serif;font-size:14px;background:var(--surface2);
    border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 13px;outline:none;transition:border-color .2s;
  }
  .modal-field input[type=date] { color-scheme:dark; }
  .modal-field input:focus,.modal-field select:focus { border-color:var(--accent); }
  .modal-field select option { background:var(--surface2); }
  .modal-agency-group { display:flex;gap:7px;flex-wrap:wrap; }
  .modal-agency-btn { font-family:'Pretendard',sans-serif;font-size:12px;font-weight:500;padding:6px 13px;border-radius:99px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s; }
  .modal-agency-btn.active-ops     { border-color:var(--ops);    color:var(--ops);    background:rgba(232,236,244,.1); }
  .modal-agency-btn.active-naver   { border-color:var(--naver);  color:var(--naver);  background:rgba(0,199,60,.12); }
  .modal-agency-btn.active-upstage { border-color:var(--upstage);color:var(--upstage);background:rgba(139,92,246,.12); }
  .modal-agency-btn.active-sejong  { border-color:var(--sejong); color:var(--sejong); background:rgba(195,0,47,.12); }
  .modal-footer { display:flex;justify-content:flex-end;gap:10px;margin-top:22px; }
  .btn-cancel { font-family:'Pretendard',sans-serif;font-size:13px;font-weight:600;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:9px 20px;cursor:pointer;transition:all .15s; }
  .btn-cancel:hover { border-color:var(--text);color:var(--text); }
  .btn-save { font-family:'Pretendard',sans-serif;font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:9px;padding:9px 24px;cursor:pointer;transition:opacity .2s; }
  .btn-save:hover { opacity:.88; }

  .note-banner { font-size:12px;color:var(--muted);background:rgba(79,142,247,.06);border:1px solid rgba(79,142,247,.15);border-radius:8px;padding:7px 14px;margin:8px 18px 4px; }
  .empty-state { text-align:center;padding:28px;color:var(--muted);font-size:13px; }

  /* ══════════════════════════════
     ── TIMELINE ──
  ══════════════════════════════ */
  .timeline-section {
    max-width:960px;margin:48px auto 0;
    padding-bottom:60px;
  }
  .timeline-header {
    display:flex;align-items:baseline;gap:12px;margin-bottom:28px;
    border-top:1px solid var(--border);padding-top:32px;
  }
  .timeline-title {
    font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--text);
  }
  .timeline-title span { color:var(--accent); }
  .timeline-sub { font-size:12px;color:var(--muted); }

  .timeline-wrap {
    position:relative;padding-left:36px;
  }
  /* 수직 선 */
  .timeline-wrap::before {
    content:'';position:absolute;left:10px;top:0;bottom:0;
    width:2px;background:var(--border);border-radius:2px;
  }

  /* 월 구분 헤더 */
  .tl-month {
    position:relative;margin-bottom:20px;
  }
  .tl-month-label {
    font-size:11px;font-weight:700;letter-spacing:.08em;
    color:var(--muted);text-transform:uppercase;
    background:var(--bg);padding:0 10px 0 0;
    position:relative;z-index:1;
    display:inline-block;margin-left:-28px;
    border:1px solid var(--border);border-radius:99px;
    padding:3px 12px;font-family:'DM Mono',monospace;
  }

  /* 타임라인 아이템 */
  .tl-item {
    position:relative;margin-bottom:12px;
    display:flex;align-items:flex-start;gap:14px;
  }
  /* 점 */
  .tl-dot {
    position:absolute;left:-30px;top:10px;
    width:12px;height:12px;border-radius:50%;
    border:2px solid var(--bg);
    flex-shrink:0;transition:transform .2s;
    z-index:1;
  }
  .tl-item:hover .tl-dot { transform:scale(1.3); }

  /* 날짜 */
  .tl-date {
    font-family:'DM Mono',monospace;font-size:11px;font-weight:500;
    color:var(--muted);white-space:nowrap;
    padding-top:11px;min-width:52px;text-align:right;
    margin-left:-14px;
  }

  /* 카드 */
  .tl-card {
    flex:1;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:11px 14px;
    transition:border-color .2s, opacity .2s;
    cursor:default;
  }
  .tl-card:hover { border-color:rgba(79,142,247,.4); }

  /* 완료 항목: 흐리게 */
  .tl-item.done .tl-card {
    opacity:.38;
  }
  .tl-item.done .tl-dot {
    opacity:.35;
  }
  .tl-item.done .tl-card-text {
    text-decoration:line-through;
  }

  /* 기한 초과 */
  .tl-item.over .tl-dot    { box-shadow:0 0 0 3px rgba(247,111,111,.25); }
  .tl-item.over .tl-date   { color:var(--red); }

  /* 7일 이내 */
  .tl-item.near .tl-dot    { box-shadow:0 0 0 3px rgba(245,200,66,.25); }
  .tl-item.near .tl-date   { color:var(--yellow); }

  /* 오늘 */
  .tl-item.today .tl-dot   { box-shadow:0 0 0 4px rgba(61,214,140,.3); }
  .tl-item.today .tl-date  { color:var(--green);font-weight:700; }

  .tl-card-top {
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px;
  }
  .tl-card-text {
    font-size:14px;font-weight:500;color:var(--text);line-height:1.4;flex:1;min-width:0;
  }
  .tl-card-meta {
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;
  }

  /* 오늘 마커 */
  .tl-today-marker {
    position:relative;margin-bottom:16px;display:flex;align-items:center;gap:10px;
  }
  .tl-today-marker::before {
    content:'';position:absolute;left:-30px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;border-radius:50%;
    background:var(--green);border:3px solid var(--bg);
    box-shadow:0 0 0 3px rgba(61,214,140,.3);z-index:2;
  }
  .tl-today-line {
    flex:1;height:1px;background:rgba(61,214,140,.4);
    border-top:1px dashed rgba(61,214,140,.5);
  }
  .tl-today-label {
    font-size:11px;font-weight:700;color:var(--green);
    font-family:'DM Mono',monospace;white-space:nowrap;
  }

  /* 기한 없음 */
  .tl-nodl {
    margin-top:24px;padding-top:20px;border-top:1px dashed var(--border);
  }
  .tl-nodl-label {
    font-size:11px;color:var(--muted);margin-bottom:10px;
    font-family:'DM Mono',monospace;letter-spacing:.05em;
  }
  .tl-nodl-list { display:flex;flex-direction:column;gap:6px; }
  .tl-nodl-item {
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:8px 12px;opacity:.5;
    font-size:13px;color:var(--muted);
  }
  .timeline-loading { color:var(--muted);font-size:13px;padding:20px; }

  /* ── 완료 항목 섹션 ── */
  .done-section {
    max-width:960px;margin:20px auto 0;
    border:1px solid var(--border);border-radius:16px;overflow:hidden;
  }
  .done-section-header {
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;cursor:pointer;user-select:none;
    background:var(--surface);transition:background .15s;
  }
  .done-section-header:hover { background:var(--surface2); }
  .done-section-title {
    display:flex;align-items:center;gap:10px;
    font-size:15px;font-weight:700;color:var(--green);
  }
  .done-section-icon { font-size:16px; }
  .done-count-badge {
    font-size:11px;font-weight:700;
    background:rgba(61,214,140,.15);color:var(--green);
    border:1px solid rgba(61,214,140,.3);border-radius:99px;
    padding:1px 9px;font-family:'DM Mono',monospace;
  }
  .done-section-toggle {
    font-size:13px;color:var(--muted);transition:transform .25s;
  }
  .done-section.collapsed .done-section-toggle { transform:rotate(-90deg); }
  .done-section.collapsed .done-section-body   { display:none; }
  .done-section-body {
    padding:12px 0 4px;
    background:rgba(61,214,140,.02);
    border-top:1px solid var(--border);
  }
  /* 완료 항목은 흐릿하게 */
  #doneContainer .task-item { opacity:.6; }
  #doneContainer .task-item:hover { opacity:1; }

  /* ══════════════════════════════
     ── CONTACTS ──
  ══════════════════════════════ */
  .contacts-section {
    max-width:960px;margin:48px auto 0;padding-bottom:80px;
  }
  .contacts-header {
    display:flex;align-items:baseline;gap:12px;margin-bottom:28px;
    border-top:1px solid var(--border);padding-top:32px;
  }
  .contacts-title { font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--text); }
  .contacts-title span { color:var(--accent); }
  .contacts-sub { font-size:12px;color:var(--muted); }

  /* 입력 폼 */
  .contact-add-form {
    background:rgba(79,142,247,.04);border:2px solid var(--accent);
    border-radius:18px;padding:22px 24px 20px;margin-bottom:36px;
    box-shadow:0 0 0 5px rgba(79,142,247,.06),0 4px 24px rgba(0,0,0,.3);
  }
  .contact-form-title {
    font-size:16px;font-weight:800;color:var(--accent);margin-bottom:16px;
    display:flex;align-items:center;gap:8px;
  }
  .contact-form-title-icon {
    width:28px;height:28px;border-radius:8px;
    background:rgba(79,142,247,.15);display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  .contact-form-grid {
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 12px;
  }
  .contact-form-field { display:flex;flex-direction:column;gap:5px; }
  .contact-form-field.full { grid-column:span 3; }
  .contact-form-field.half { grid-column:span 1; }
  .contact-field-label {
    font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;
  }
  .contact-form-field input,.contact-form-field select {
    font-family:'Pretendard',sans-serif;font-size:13px;
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text);border-radius:9px;padding:9px 12px;outline:none;
    transition:border-color .2s;width:100%;
  }
  .contact-form-field input::placeholder { color:var(--muted); }
  .contact-form-field input:focus,.contact-form-field select:focus { border-color:var(--accent); }
  .contact-form-field select option { background:var(--surface2); }
  .contact-form-footer { display:flex;justify-content:flex-end;margin-top:14px; }
  .btn-contact-add {
    font-family:'Pretendard',sans-serif;font-size:14px;font-weight:700;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;border:none;border-radius:10px;padding:11px 28px;
    cursor:pointer;transition:opacity .2s;
    box-shadow:0 4px 14px rgba(79,142,247,.3);
  }
  .btn-contact-add:hover { opacity:.88; }

  /* 소속별 그룹 */
  .contact-groups { display:flex;flex-direction:column;gap:28px; }
  .contact-group-label {
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;font-family:'DM Mono',monospace;
    display:flex;align-items:center;gap:8px;
  }
  .contact-group-label::after {
    content:'';flex:1;height:1px;background:var(--border);border-radius:1px;
  }
  .contact-cards { display:flex;flex-wrap:wrap;gap:14px; }

  /* 카드 공통 */
  .contact-card {
    width:200px;border-radius:16px;padding:20px 18px 16px;
    border:1px solid transparent;
    position:relative;overflow:hidden;
    transition:transform .2s,box-shadow .2s;
    display:flex;flex-direction:column;gap:10px;
  }
  .contact-card:hover { transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.35); }

  /* 빈 카드 (placeholder) */
  .contact-card.empty {
    border-style:dashed;opacity:.4;
    align-items:center;justify-content:center;
    min-height:160px;cursor:default;
  }
  .contact-card.empty:hover { transform:none;box-shadow:none; }
  .contact-card-empty-icon { font-size:22px;margin-bottom:4px; }
  .contact-card-empty-text { font-size:12px;color:var(--muted); }

  /* 카드 상단 줄무늬 */
  .contact-card-stripe {
    position:absolute;top:0;left:0;right:0;height:4px;border-radius:16px 16px 0 0;
  }

  /* 아바타 이니셜 */
  .contact-avatar {
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:800;color:#fff;flex-shrink:0;
  }

  .contact-card-top { display:flex;align-items:center;gap:10px; }
  .contact-card-info { flex:1;min-width:0; }
  .contact-name {
    font-size:14px;font-weight:700;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .contact-role {
    font-size:11px;color:var(--muted);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* 연락처 항목 */
  .contact-detail {
    display:flex;align-items:center;gap:7px;
    font-size:12px;color:var(--muted);line-height:1.4;
  }
  .contact-detail-icon { font-size:11px;flex-shrink:0;opacity:.7; }
  .contact-detail a {
    color:inherit;text-decoration:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:color .15s;
  }
  .contact-detail a:hover { color:var(--text); }

  /* 삭제 버튼 */
  .contact-del-btn {
    position:absolute;top:10px;right:10px;
    background:none;border:none;color:transparent;
    cursor:pointer;font-size:14px;padding:2px 5px;border-radius:5px;
    transition:all .15s;line-height:1;
  }
  .contact-card:hover .contact-del-btn { color:var(--muted); }
  .contact-del-btn:hover { color:var(--red) !important;background:rgba(247,111,111,.12); }

  @media(max-width:700px){
    .add-grid{grid-template-columns:1fr 1fr}.add-field.full{grid-column:span 2}
    .contact-form-grid{grid-template-columns:1fr 1fr}
    .contact-form-field.full{grid-column:span 2}
    .contact-card{width:calc(50% - 7px)}
    .filter-row{flex-direction:column;gap:6px;align-items:stretch;}
    .filter-row-label{border-right:none;padding-right:0;padding-top:0;min-width:0;}
  }
  @media(max-width:480px){
    .add-grid{grid-template-columns:1fr}.add-field.full{grid-column:span 1}
    .contact-form-grid{grid-template-columns:1fr}
    .contact-form-field.full,.contact-form-field.half{grid-column:span 1}
    .contact-card{width:100%}
  }
</style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><div class="loading-text">데이터 불러오는 중...</div></div>
<div id="syncStatus"><span class="sync-dot"></span><span id="syncText">연결 중</span></div>

<!-- ── 수정 모달 ── -->
<div class="modal-overlay hidden" id="editModal">
  <div class="modal">
    <div class="modal-title">✏️ 항목 수정</div>
    <div class="modal-grid">
      <div class="modal-field"><label>내용</label><input type="text" id="editText" /></div>
      <div class="modal-field">
        <label>카테고리</label>
        <select id="editCat">
          <option value="강사·커리큘럼">강사·커리큘럼</option>
          <option value="장소·시설">장소·시설</option>
          <option value="운영·물품">운영·물품</option>
          <option value="사후처리">사후처리</option>
        </select>
      </div>
      <div class="modal-field">
        <label>작성자</label>
        <select id="editWriter">
          <option value="운영팀">운영팀</option>
          <option value="네이버">네이버</option>
          <option value="Upstage">Upstage</option>
          <option value="세종대">세종대</option>
        </select>
      </div>
      <div class="modal-field">
        <label>우선순위</label>
        <select id="editPriority">
          <option value="high">🔴 우선</option>
          <option value="mid">🟡 보통</option>
          <option value="low">⚪ 나중</option>
        </select>
      </div>
      <div class="modal-field"><label>업무 기한</label><input type="date" id="editDeadline" /></div>
      <div class="modal-field">
        <label>담당기관</label>
        <div class="modal-agency-group">
          <button class="modal-agency-btn" id="mab-ops"     onclick="toggleEditAgency('ops')">운영팀</button>
          <button class="modal-agency-btn" id="mab-naver"   onclick="toggleEditAgency('naver')">네이버</button>
          <button class="modal-agency-btn" id="mab-upstage" onclick="toggleEditAgency('upstage')">Upstage</button>
          <button class="modal-agency-btn" id="mab-sejong"  onclick="toggleEditAgency('sejong')">세종대</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save"   onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<!-- ── Header ── -->
<div class="header">
  <div class="header-left">
    <h1>충북교육청 <span>AI 교원연수</span> 준비 현황</h1>
    <div class="meta">
      <span class="meta-chip"><span class="dot"></span>2026년 8월 12~14일 · 2박 3일</span>
      <span class="meta-chip"><span class="dot" style="background:var(--green)"></span>세종대학교 (장소 확정)</span>
      <span class="meta-chip"><span class="dot" style="background:var(--accent2)"></span>50명 이하</span>
    </div>
  </div>
  <div class="dday" id="ddayBadge">D-?</div>
</div>

<!-- ── Sticky Nav ── -->
<div class="sticky-nav" id="stickyNav">
  <div class="sticky-nav-inner">
    <button class="snav-btn" onclick="navScrollTo('sec-todo')"     id="snav-todo">📋 To Do</button>
    <button class="snav-btn" onclick="navScrollTo('sec-timeline')" id="snav-timeline">📅 타임라인</button>
    <button class="snav-btn" onclick="navScrollTo('sec-contacts')" id="snav-contacts">👥 연락처</button>
    <a class="snav-btn snav-link" href="timetable.html" target="_blank" rel="noopener">🕐 운영 시간표 ↗</a>
  </div>
</div>

<!-- ── Progress ── -->
<div class="progress-section">
  <span class="progress-label">전체 진행률</span>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
  <span class="progress-pct" id="progressPct">0%</span>
  <div class="stat-chips">
    <span class="stat-chip done" id="statDone">완료 0</span>
    <span class="stat-chip todo" id="statTodo">미완 0</span>

const CAT_CONFIG = {
  '강사·커리큘럼':{ icon:'🎓', color:'#7c6af7' },
  '장소·시설':    { icon:'🏛️', color:'#3dd68c' },
  '운영·물품':    { icon:'⚙️',  color:'#f7a34f' },
  '사후처리':     { icon:'📊', color:'#f76f6f' },
};
const CAT_NOTES = { '운영·물품':'세부 항목은 추후 업데이트 예정', '사후처리':'세부 항목은 추후 업데이트 예정' };
const ENTITY_CLS   = { '운영팀':'ops','네이버':'naver','Upstage':'upstage','세종대':'sejong', ops:'ops',naver:'naver',upstage:'upstage',sejong:'sejong' };
const ENTITY_LABEL = { ops:'운영팀', naver:'네이버', upstage:'Upstage', sejong:'세종대' };

let tasks      = {};
let activeFilter  = '전체';
let viewMode      = 'cat';
let agencyFilter  = 'all';
let newAgencies   = [];
let isReady       = false;
let seedAttempted = false;

// 수정 모달 상태
let editKey      = null;
let editAgencies = [];

/* ── sync ── */
function setSyncStatus(state, text) {
  const el = document.getElementById('syncStatus');
  el.className = state; el.style.display = 'flex';
  document.getElementById('syncText').textContent = text;
}

/* ── D-Day ── */
function calcDDay() {
  const target = new Date('2026-08-12');
  const today  = new Date(); today.setHours(0,0,0,0);
  const diff   = Math.ceil((target-today)/86400000);
  document.getElementById('ddayBadge').textContent = diff>0?`D-${diff}`:diff===0?'D-Day!':`D+${Math.abs(diff)}`;
}

/* ── progress ── */
function updateProgress() {
  const list  = Object.values(tasks);
  const total = list.length, done = list.filter(t=>t.done).length;
  const pct   = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressBar').style.width = pct+'%';
  document.getElementById('progressPct').textContent = pct+'%';
  document.getElementById('statDone').textContent = `완료 ${done}`;
  document.getElementById('statTodo').textContent = `미완 ${total-done}`;
}

/* ── 메인 리스트: 미완 항목만 + 담당기관 필터 ── */
function applyDoneFilter(entries) {
  let result = entries.filter(([,t]) => !t.done);  // 항상 미완만
  result = applyAgencyFilter(result);
  return result;
}

/* ── 뷰 탭 ── */
window.setView = (mode) => {
  viewMode = mode;
  ['cat','priority','deadline'].forEach(m => {
    document.getElementById(`vt-${m}`).classList.toggle('active', m===mode);
  });
  // 업무 구분 필터는 cat 뷰에서만 표시 (레이블 포함)
  document.getElementById('filterRowCat').style.display = mode==='cat' ? 'flex' : 'none';
  renderAll();
};

/* ── 카테고리 필터 ── */
function renderFilters() {
  document.getElementById('filterSection').innerHTML =
    ['전체',...Object.keys(CAT_CONFIG)].map(c =>
      `<button class="filter-btn ${activeFilter===c?'active':''}" onclick="setFilter('${c}')">${c}</button>`
    ).join('');
}
window.setFilter = (cat) => { activeFilter=cat; renderFilters(); renderAll(); updateProgress(); };

/* ── 담당기관 필터 ── */
const AGENCY_TABS = [
  { key:'all',     label:'전체',    cls:'af-all' },
  { key:'ops',     label:'운영팀',  cls:'af-ops' },
  { key:'naver',   label:'네이버',  cls:'af-naver' },
  { key:'upstage', label:'Upstage', cls:'af-upstage' },
  { key:'sejong',  label:'세종대',  cls:'af-sejong' },
];

function renderAgencyFilter() {
  const sec = document.getElementById('agencyFilterSection');
  if (!sec) return;
  sec.innerHTML = AGENCY_TABS.map(t =>
    `<button class="agency-filter-btn ${t.cls} ${agencyFilter===t.key?'active':''}"
       onclick="setAgencyFilter('${t.key}')">${t.label}</button>`
  ).join('');
}

window.setAgencyFilter = (key) => {
  agencyFilter = key;
  renderAgencyFilter();
  renderAll();
};

function applyAgencyFilter(entries) {
  if (agencyFilter === 'all') return entries;
  return entries.filter(([,t]) => {
    const agencies = t.agencies || [];
    // 소속 키와 ENTITY_CLS 역방향 매핑
    return agencies.some(a => {
      const cls = ENTITY_CLS[a] || a;
      return cls === agencyFilter;
    });
  });
}

/* ── 기한 표시 ── */
function deadlineDisplay(dl) {
  if (!dl) return '';
  const d=new Date(dl), today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.ceil((d-today)/86400000);
  const str=dl.replace(/-/g,'.').slice(2);
  let cls=''; if(diff<0) cls='over'; else if(diff<=7) cls='near';
  const icon=diff<0?'⚠️':'📅';
  return `<span class="task-deadline ${cls}">${icon} ${str}</span>`;
}

/* ── 최종 업데이트 시각 ── */
function lastUpdatedStr(t) {
  const ts = t.updatedAt;
  if (!ts) return '';
  const d = new Date(ts);
  return `최종 수정: ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ── 태스크 렌더 ── */
function renderTask(key, t, showCat=false) {
  const pl = t.priority==='high'?'우선':t.priority==='mid'?'보통':'';
  const pc = t.priority==='high'?'priority-high':t.priority==='mid'?'priority-mid':'';

  const agencyTags = (t.agencies||[]).map(a => {
    const cls=ENTITY_CLS[a]||a, lbl=ENTITY_LABEL[a]||a;
    return `<span class="tag agency-${cls}">${lbl}</span>`;
  }).join('');

  const cTag   = t.confirmed ? `<span class="tag confirmed">✓ 확정</span>` : '';
  const dl     = deadlineDisplay(t.deadline||'');
  const catCfg = CAT_CONFIG[t.cat];
  const catTag = showCat && catCfg
    ? `<span class="tag cat-tag" style="color:${catCfg.color};border-color:${catCfg.color}44;background:${catCfg.color}11">${catCfg.icon} ${t.cat}</span>`
    : '';

  // 메모
  const memos = t.memos ? Object.entries(t.memos).sort(([,a],[,b])=>(a.ts||0)-(b.ts||0)) : [];
  const WRITER_CLS = { '운영팀':'w-ops','네이버':'w-naver','Upstage':'w-upstage','세종대':'w-sejong' };
  const memoListHtml = memos.map(([mk,m]) => {
    const wCls = WRITER_CLS[m.writer]||'';
    const d = new Date(m.ts);
    const dateStr = `${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}. ${d.getHours()>=12?'오후':'오전'} ${String(d.getHours()>12?d.getHours()-12:d.getHours()||12).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `
    <div class="memo-item" id="mi-${key}-${mk}" data-writer="${m.writer||''}" data-text="${(m.text||'').replace(/"/g,'&quot;')}">
      <span class="memo-writer ${wCls}">${m.writer||'?'}</span>
      <span class="memo-text">${m.text}</span>
      <span class="memo-date">${dateStr}</span>
      <div class="memo-actions">
        <button class="memo-btn" onclick="startEditMemo('${key}','${mk}')" title="수정">✏️</button>
        <button class="memo-btn del" onclick="deleteMemo('${key}','${mk}')" title="삭제">×</button>
      </div>
    </div>`;
  }).join('');

  // 링크
  const links = t.links ? Object.entries(t.links).sort(([,a],[,b])=>(a.ts||0)-(b.ts||0)) : [];
  const linksHtml = links.length ? `
    <div class="task-links">
      ${links.map(([lk,l]) => `
        <a class="task-link-chip" href="${l.url}" target="_blank" rel="noopener">
          <span class="link-icon">🔗</span>
          <span class="link-label">${l.label || l.url}</span>
        </a>
        <button class="task-link-del" onclick="deleteLink('${key}','${lk}')" title="링크 삭제">×</button>
      `).join('')}
    </div>` : '';

  const lastUpd = lastUpdatedStr(t);

  return `
  <div class="task-item ${t.done?'done':''}" id="ti-${key}">
    <div class="task-main">
      <div class="check-wrap" onclick="toggleTask('${key}')" title="완료 처리">
        <span class="check-icon">✓</span>
        <span class="check-label">완료</span>
      </div>
      <div class="task-content">
        ${pl ? `<span class="tag ${pc}">${pl}</span>` : ''}
        ${catTag}
        <span class="task-text">${t.text}</span>
        ${agencyTags}${cTag}
        ${dl}
      </div>
      <div class="task-actions">
        <button class="btn-icon btn-link" onclick="toggleLinkForm('${key}')" title="링크 추가">📎</button>
        <button class="btn-icon btn-edit" onclick="openEdit('${key}')"        title="수정">✏️</button>
        <button class="btn-icon btn-del"  onclick="deleteTask('${key}')"      title="삭제">×</button>
      </div>
    </div>
    ${lastUpd ? `<div class="task-last-updated">${lastUpd}</div>` : ''}
    ${linksHtml}
    <div class="link-add-row" id="lar-${key}">
      <input class="link-inp url"   id="lu-${key}" placeholder="https://drive.google.com/..." />
      <input class="link-inp label" id="ll-${key}" placeholder="파일명 (선택)" />
      <button class="link-save-btn"   onclick="addLink('${key}')">추가</button>
      <button class="link-cancel-btn" onclick="toggleLinkForm('${key}')">취소</button>
    </div>
    <div class="task-memo-wrap">
      ${memoListHtml ? `<div class="memo-list">${memoListHtml}</div>` : ''}
      <div class="memo-input-row">

window.addLink = async (key) => {

/* ── 그룹 렌더 공통 ── */
function renderGroup(cid, icon, label, color, items, note='') {
  const done = items.filter(([,t])=>t.done).length;
  const pct  = items.length ? Math.round(done/items.length*100) : 0;
  return `
  <div class="cat-group" id="${cid}">
    <div class="cat-header" onclick="toggleCat('${cid}')">
      <div class="cat-title">
        <div class="cat-icon" style="background:${color}22;color:${color}">${icon}</div>
        <span>${label}</span>
      </div>
      <div class="cat-stats">
        <span>${done}/${items.length}</span>
        <div class="mini-progress"><div class="mini-progress-fill" style="width:${pct}%;background:${color}"></div></div>
        <span class="collapse-btn">▾</span>
      </div>
    </div>
    <div class="task-list">
      ${note}
      ${items.length
        ? items.map(([k,t])=>renderTask(k,t,true)).join('')

    </div>
  </div>`;
}

/* ── 카테고리별 ── */
function renderByCat() {
  const cats = activeFilter==='전체' ? Object.keys(CAT_CONFIG) : [activeFilter];
  document.getElementById('catContainer').innerHTML = cats.map(cat => {
    const cfg = CAT_CONFIG[cat];
    let ct = Object.entries(tasks).filter(([,t])=>t.cat===cat).sort(([,a],[,b])=>(a.order||0)-(b.order||0));
    ct = applyDoneFilter(ct);
    const note = CAT_NOTES[cat] ? `<div class="note-banner">📝 ${CAT_NOTES[cat]}</div>` : '';
    const cid  = 'cg-'+cat.replace(/[·\s]/g,'-');
    return renderGroup(cid, cfg.icon, cat, cfg.color, ct, note);
  }).join('');
}

/* ── 우선순위별 ── */
function renderByPriority() {
  const GROUPS = [
    { key:'high', label:'우선',  color:'#f76f6f', icon:'🔴' },
    { key:'mid',  label:'보통',  color:'#f5c842', icon:'🟡' },
    { key:'low',  label:'나중',  color:'#6b7a9e', icon:'⚪' },
  ];
  const all = applyDoneFilter(Object.entries(tasks).sort(([,a],[,b])=>(a.order||0)-(b.order||0)));
  document.getElementById('catContainer').innerHTML = GROUPS.map(pg => {
    const ct = all.filter(([,t])=>(t.priority||'low')===pg.key);
    return renderGroup('pg-'+pg.key, pg.icon, `${pg.label} 항목`, pg.color, ct);

/* ── 날짜 임박순 ── */
function renderByDeadline() {
  const today = new Date(); today.setHours(0,0,0,0);
  const all   = applyDoneFilter(Object.entries(tasks));
  const withDL = all.filter(([,t])=>t.deadline).sort(([,a],[,b])=>new Date(a.deadline)-new Date(b.deadline));
  const noDL   = all.filter(([,t])=>!t.deadline).sort(([,a],[,b])=>(a.order||0)-(b.order||0));
  const groups = [
    { key:'over',  label:'기한 초과',  color:'#f76f6f', icon:'⚠️',  items:[] },
    { key:'week',  label:'7일 이내',   color:'#f5c842', icon:'📅',  items:[] },
    { key:'month', label:'한 달 이내', color:'#4f8ef7', icon:'📆',  items:[] },
    { key:'later', label:'이후',       color:'#6b7a9e', icon:'🗓️', items:[] },
  ];
  withDL.forEach(e => {
    const diff = Math.ceil((new Date(e[1].deadline)-today)/86400000);
    if      (diff<0)   groups[0].items.push(e);
    else if (diff<=7)  groups[1].items.push(e);
    else if (diff<=31) groups[2].items.push(e);
    else               groups[3].items.push(e);
  });
  const noGroup = { key:'nodl', label:'기한 미설정', color:'#2a3050', icon:'📋', items:noDL };
  const visible = [...groups, noGroup].filter(g=>g.items.length>0);
  document.getElementById('catContainer').innerHTML = visible.length
    ? visible.map(g => renderGroup('dlg-'+g.key, g.icon, g.label, g.color, g.items)).join('')
    : '<div class="empty-state" style="color:var(--muted);text-align:center;padding:32px">항목이 없습니다</div>';
}

function renderAll() {
  if      (viewMode==='cat')      renderByCat();
  else if (viewMode==='priority') renderByPriority();
  else if (viewMode==='deadline') renderByDeadline();
  renderDoneSection();
  renderTimeline();
  renderAgencyFilter();
}

/* ── 완료 항목 섹션 ── */
function renderDoneSection() {
  const container = document.getElementById('doneContainer');
  const badge     = document.getElementById('doneCountBadge');
  if (!container) return;

  // 완료된 항목 + 담당기관 필터 적용
  let doneEntries = Object.entries(tasks)
    .filter(([,t]) => t.done)
    .sort(([,a],[,b]) => (b.updatedAt||0) - (a.updatedAt||0));  // 최근 완료순
  doneEntries = applyAgencyFilter(doneEntries);

  if (badge) badge.textContent = doneEntries.length;

  if (doneEntries.length === 0) {
    container.innerHTML = '<div class="empty-state">완료된 항목이 없습니다</div>';
    return;
  }

  // 카테고리별 그룹핑
  const grouped = {};
  doneEntries.forEach(entry => {
    const cat = entry[1].cat || '기타';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(entry);
  });

  container.innerHTML = Object.entries(grouped).map(([cat, items]) => {
    const cfg = CAT_CONFIG[cat] || { icon:'📌', color:'#6b7a9e' };
    const cid = 'done-cg-' + cat.replace(/[·\s]/g,'-');
    return `
    <div class="cat-group" id="${cid}" style="margin:0 0 12px;border-radius:10px;">
      <div class="cat-header" onclick="toggleCat('${cid}')" style="padding:10px 16px;">

          <div class="cat-icon" style="background:${cfg.color}22;color:${cfg.color};width:24px;height:24px;">${cfg.icon}</div>
          <span style="font-size:13px;">${cat}</span>
        </div>
        <div class="cat-stats">
          <span>${items.length}개</span>
          <span class="collapse-btn">▾</span>
        </div>
      </div>
      <div class="task-list">
        ${items.map(([k,t]) => renderTask(k, t, true)).join('')}

    </div>`;
  }).join('');
}

/* ══════════════════════════════
   ── TIMELINE ──
══════════════════════════════ */
function renderTimeline() {
  const wrap  = document.getElementById('timelineWrap');
  if (!wrap) return;

  const today = new Date(); today.setHours(0,0,0,0);
  const allEntries = Object.entries(tasks);

  // 기한 있는 항목 날짜순 정렬
  const withDL = allEntries
    .filter(([,t]) => t.deadline)
    .sort(([,a],[,b]) => new Date(a.deadline) - new Date(b.deadline));

  // 기한 없는 항목
  const noDL = allEntries
    .filter(([,t]) => !t.deadline)
    .sort(([,a],[,b]) => (a.order||0) - (b.order||0));

  if (withDL.length === 0 && noDL.length === 0) {
    wrap.innerHTML = '<div class="timeline-loading">기한이 설정된 항목이 없습니다</div>';
    return;
  }

  // 날짜 포맷 헬퍼
  const fmtDate = (dl) => {
    const d = new Date(dl);
    return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  };
  const fmtMonth = (dl) => {
    const d = new Date(dl);
    return `${d.getFullYear()}년 ${d.getMonth()+1}월`;
  };

  // 긴급도 클래스
  const urgency = (dl, done) => {
    if (done) return 'done';
    const diff = Math.ceil((new Date(dl) - today) / 86400000);
    if (diff < 0)  return 'over';
    if (diff === 0) return 'today';
    if (diff <= 7)  return 'near';
    return '';
  };

  // 점 색상
  const dotColor = (dl, done) => {
    if (done) return 'var(--border)';
    const diff = Math.ceil((new Date(dl) - today) / 86400000);
    if (diff < 0)   return 'var(--red)';
    if (diff === 0) return 'var(--green)';
    if (diff <= 7)  return 'var(--yellow)';
    return 'var(--accent)';
  };

  // 카테고리 태그
  const catTag = (cat) => {
    const cfg = CAT_CONFIG[cat];
    if (!cfg) return '';
    return `<span class="tag cat-tag" style="color:${cfg.color};border-color:${cfg.color}44;background:${cfg.color}11">${cfg.icon} ${cat}</span>`;
  };

  // 담당기관 태그
  const agencyTags = (agencies) => (agencies||[]).map(a => {
    const cls = ENTITY_CLS[a]||a, lbl = ENTITY_LABEL[a]||a;
    return `<span class="tag agency-${cls}">${lbl}</span>`;
  }).join('');

  // 우선순위 태그
  const prioTag = (p) => {
    if (p === 'high') return `<span class="tag priority-high">우선</span>`;
    if (p === 'mid')  return `<span class="tag priority-mid">보통</span>`;
    return '';
  };

  // 오늘 기준으로 before/after 분리
  const past   = withDL.filter(([,t]) => new Date(t.deadline) < today);
  const future = withDL.filter(([,t]) => new Date(t.deadline) >= today);

  // 타임라인 아이템 HTML 생성
  const itemHtml = ([key, t]) => {
    const urg  = urgency(t.deadline, t.done);
    const col  = dotColor(t.deadline, t.done);
    const doneClass = t.done ? 'done' : '';
    return `
    <div class="tl-item ${urg} ${doneClass}">
      <div class="tl-dot" style="background:${col}"></div>
      <div class="tl-date">${fmtDate(t.deadline)}</div>
      <div class="tl-card">
        <div class="tl-card-top">
          ${prioTag(t.priority)}
          <span class="tl-card-text">${t.text}</span>
          ${t.done ? '<span class="tag confirmed">✓ 완료</span>' : ''}
        </div>
        <div class="tl-card-meta">
          ${catTag(t.cat)}
          ${agencyTags(t.agencies)}
        </div>
      </div>
    </div>`;
  };

  // 월별 그룹핑 함수
  const groupByMonth = (entries) => {
    const months = {};
    entries.forEach(e => {
      const key = fmtMonth(e[1].deadline);
      if (!months[key]) months[key] = [];
      months[key].push(e);
    });
    return months;
  };

  let html = '';

  // 과거 항목 (완료됐든 아니든)
  if (past.length > 0) {
    const pastMonths = groupByMonth(past);
    Object.entries(pastMonths).forEach(([month, items]) => {
      html += `<div class="tl-month"><span class="tl-month-label">${month}</span></div>`;
      html += items.map(itemHtml).join('');
    });
  }

  // 오늘 마커
  html += `
  <div class="tl-today-marker">
    <div class="tl-today-line"></div>
    <span class="tl-today-label">TODAY</span>
    <div class="tl-today-line"></div>
  </div>`;

  // 미래 항목
  if (future.length > 0) {
    const futureMonths = groupByMonth(future);
    Object.entries(futureMonths).forEach(([month, items]) => {
      html += `<div class="tl-month"><span class="tl-month-label">${month}</span></div>`;
      html += items.map(itemHtml).join('');
    });
  }

  // 기한 없는 항목
  if (noDL.length > 0) {
    const nodlItems = noDL.map(([,t]) => `
      <div class="tl-nodl-item">
        <span style="color:var(--muted);font-size:11px;">—</span>
        ${prioTag(t.priority)}
        <span>${t.text}</span>
        ${t.done ? '<span class="tag confirmed" style="margin-left:auto">✓ 완료</span>' : ''}
      </div>`).join('');
    html += `
    <div class="tl-nodl">
      <div class="tl-nodl-label">기한 미설정</div>
      <div class="tl-nodl-list">${nodlItems}</div>
    </div>`;
  }

  wrap.innerHTML = html;
}

/* ── Firebase 리스너 ── */
setSyncStatus('syncing','연결 중...');
onValue(tasksRef, snap => {
  const data = snap.val();
  if(!data){
    // 빈 DB인 경우, 이 세션에서 한 번만 초기 데이터 입력 시도
    if(!seedAttempted){
      seedAttempted = true;
      INITIAL_TASKS.forEach((t,i)=>push(tasksRef,{...t,order:i,updatedAt:Date.now()}));
    }
    return;
  }
  tasks = data;
  if(!isReady){
    isReady=true;
    const ov=document.getElementById('loadingOverlay');
    ov.classList.add('hidden'); setTimeout(()=>ov.style.display='none',400);
  }
  renderFilters(); renderAll(); updateProgress();
  setSyncStatus('synced','실시간 동기화 중');
}, err => { console.error(err); setSyncStatus('error','연결 오류'); });

calcDDay();

/* ── Sticky Nav ── */
window.navScrollTo = (id) => {
  const el = document.getElementById(id);
  if (!el) return;
  const navH = document.getElementById('stickyNav')?.offsetHeight || 52;
  const top  = el.getBoundingClientRect().top + window.scrollY - navH - 12;
  window.scroll({ top, behavior:'smooth' });
};

// IntersectionObserver로 현재 섹션 감지 → active 버튼 업데이트
const NAV_SECTIONS = [
  { id:'sec-todo',     btn:'snav-todo' },
  { id:'sec-timeline', btn:'snav-timeline' },
  { id:'sec-contacts', btn:'snav-contacts' },
];
const setActiveNav = (sectionId) => {
  NAV_SECTIONS.forEach(({ id, btn }) => {
    document.getElementById(btn)?.classList.toggle('active', id === sectionId);
  });
};
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) setActiveNav(e.target.id);
  });
}, { threshold: 0.15, rootMargin: '-60px 0px -60% 0px' });
// 로딩 완료 후 observe (DOM이 렌더된 뒤)
setTimeout(() => {
  NAV_SECTIONS.forEach(({ id }) => {
    const el = document.getElementById(id);
    if (el) observer.observe(el);
  });
  setActiveNav('sec-todo');
}, 1000);

/* ══════════════════════════════
   ── CONTACTS ──
══════════════════════════════ */
const contactsRef = ref(db, 'contacts');

const ORG_CONFIG = {
  naver:     { label:'네이버',  color:'#00c73c', bg:'rgba(0,199,60,.12)',   initBg:'#00c73c' },
  upstage:   { label:'Upstage', color:'#8b5cf6', bg:'rgba(139,92,246,.12)', initBg:'#8b5cf6' },
  sejong:    { label:'세종대',  color:'#c3002f', bg:'rgba(195,0,47,.12)',   initBg:'#c3002f' },
  ops:       { label:'운영팀',  color:'#e8ecf4', bg:'rgba(232,236,244,.08)',initBg:'#6b7a9e' },
  education: { label:'교육청',  color:'#f5c842', bg:'rgba(245,200,66,.12)', initBg:'#f5c842' },
};
const ORG_ORDER = ['naver','upstage','sejong','ops','education'];

let contacts = {};

/* ── 연락처 추가 ── */
window.addContact = async () => {
  const name  = document.getElementById('ct-name').value.trim();
  const org   = document.getElementById('ct-org').value;
  const role  = document.getElementById('ct-role').value.trim();
  const phone = document.getElementById('ct-phone').value.trim();
  const email = document.getElementById('ct-email').value.trim();
  if (!name) { document.getElementById('ct-name').focus(); return; }
  document.getElementById('btnContactAdd').disabled = true;
  setSyncStatus('syncing','저장 중...');
  await push(contactsRef, { name, org, role, phone, email, order: Date.now() });
  ['ct-name','ct-role','ct-phone','ct-email'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('btnContactAdd').disabled = false;
};

/* ── 연락처 삭제 ── */
window.deleteContact = async (key) => {
  if (!confirm('이 연락처를 삭제할까요?')) return;
  setSyncStatus('syncing','저장 중...');
  await remove(ref(db, `contacts/${key}`));
};

/* ── 이니셜 추출 ── */
function getInitial(name) {
  if (!name) return '?';
  return name.charAt(0).toUpperCase();
}

/* ── 카드 렌더 ── */
function renderContactCard(key, c, isEmpty=false) {
  const org = ORG_CONFIG[c.org] || ORG_CONFIG.ops;
  if (isEmpty) {
    return `
    <div class="contact-card empty" style="border-color:${org.color};background:${org.bg};">
      <div class="contact-card-empty-icon">👤</div>
      <div class="contact-card-empty-text">아직 없음</div>
    </div>`;
  }
  const phone = c.phone ? `<div class="contact-detail"><span class="contact-detail-icon">📞</span><a href="tel:${c.phone}">${c.phone}</a></div>` : '';
  const email = c.email ? `<div class="contact-detail"><span class="contact-detail-icon">✉️</span><a href="mailto:${c.email}">${c.email}</a></div>` : '';
  return `
  <div class="contact-card" style="background:${org.bg};border-color:${org.color}33;">
    <div class="contact-card-stripe" style="background:${org.color};"></div>
    <button class="contact-del-btn" onclick="deleteContact('${key}')" title="삭제">×</button>
    <div class="contact-card-top">
      <div class="contact-avatar" style="background:${org.initBg};">${getInitial(c.name)}</div>
      <div class="contact-card-info">
        <div class="contact-name">${c.name}</div>
        <div class="contact-role">${c.role||''}</div>
      </div>
    </div>
    ${phone}${email}
  </div>`;
}

/* ── 연락처 전체 렌더 ── */
function renderContacts() {
  const wrap = document.getElementById('contactGroups');
  if (!wrap) return;

  // 소속별로 분류
  const grouped = {};
  ORG_ORDER.forEach(k => grouped[k] = []);
  Object.entries(contacts)
    .sort(([,a],[,b]) => (a.order||0)-(b.order||0))
    .forEach(([key,c]) => {
      const org = c.org && grouped[c.org] !== undefined ? c.org : 'ops';
      grouped[org].push([key, c]);
    });

  wrap.innerHTML = ORG_ORDER.map(orgKey => {
    const cfg   = ORG_CONFIG[orgKey];
    const items = grouped[orgKey];
    const cardsHtml = items.length > 0
      ? items.map(([key,c]) => renderContactCard(key, c)).join('')
      : renderContactCard(null, { org: orgKey }, true);
    return `
    <div>
      <div class="contact-group-label" style="color:${cfg.color}">
        ${cfg.label} <span style="font-size:10px;opacity:.6">${items.length}명</span>
      </div>
      <div class="contact-cards">${cardsHtml}</div>
    </div>`;
  }).join('');
}

/* ── Enter 키로 추가 ── */
['ct-name','ct-role','ct-phone','ct-email'].forEach(id => {
  document.getElementById(id)?.addEventListener('keydown', e => {
    if (e.key === 'Enter') window.addContact();
  });
});

/* ── Firebase 리스너 ── */
onValue(contactsRef, snap => {
  contacts = snap.val() || {};
  renderContacts();
}, err => console.error('contacts error:', err));
</script>
